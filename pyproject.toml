[project]
name = "olist-intelligence"
version = "0.1.0"
description = "End-to-end E-commerce Intelligence Platform on the Brazilian E-Commerce Public Dataset by Olist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pandera>=0.20",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "dbt-core>=1.12.6",
    "dbt-postgres>=1.11.0",
    "dbt-bigquery>=1.12.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Notebooks are authored by hand and reformatting them produces large, meaningless diffs.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401"]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.uv]
package = false
